# Publishes the admin page (admin/) to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Admin page

on:
  push:
    branches: [main]
    paths: ['admin/**', 'src/shared/**', 'src/assets/**', 'vite.admin.config.js', 'package*.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:admin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/admin
      - id: deployment
        uses: actions/deploy-pages@v4
